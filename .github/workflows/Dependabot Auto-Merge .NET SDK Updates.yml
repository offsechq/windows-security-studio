name: Dependabot Auto-Merge .NET SDK Updates

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Read Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v3.1.0

      - name: Enable auto-merge for .NET SDK updates
        if: steps.dependabot-metadata.outputs.package-ecosystem == 'dotnet-sdk'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
